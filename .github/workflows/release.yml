name: Release VS Code Extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Antigravity hook
        run: npm --workspace @aitrace/antigravity run build

      - name: Typecheck
        run: |
          npm run typecheck
          npm --workspace aitrace run typecheck

      - name: Test
        run: |
          npm test
          npm run test:antigravity

      - name: Build extension
        run: npm --workspace aitrace run build

      - name: Package VSIX
        run: npm --workspace aitrace run package

      - name: Resolve VSIX path
        id: vsix
        run: |
          version=$(node -p "require('./vscode/package.json').version")
          echo "path=vscode/aitrace-${version}.vsix" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: aitrace-vsix
          path: ${{ steps.vsix.outputs.path }}

      - name: Publish to VS Code Marketplace
        run: >
          npx --yes @vscode/vsce@4 publish
          --packagePath "${{ steps.vsix.outputs.path }}"
          --oidc

      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.vsix.outputs.path }}
